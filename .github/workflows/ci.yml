name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝相依套件 (含開發工具)
        run: pip install -r requirements-dev.txt
      - name: Ruff 風格檢查
        run: ruff check .
      - name: Pytest 單元測試
        run: pytest -q
