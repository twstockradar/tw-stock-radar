name: 每日台股月K創新高雷達

on:
  schedule:
    # 08:20 UTC = 台灣 16:20, 週一至週五 (收盤資料已穩定)。
    # 註: 刻意避開整點 (0 分) 壅塞時段以提高觸發率;
    #     GitHub 排程仍為「盡力而為」, 可能延遲數分鐘到數十分鐘, 偶有跳過。
    #     repo 轉移後重推此檔可讓排程在新位置重新註冊。
    - cron: "20 8 * * 1-5"
  workflow_dispatch: {}   # 允許在 Actions 頁面手動觸發

permissions:
  contents: write   # 需要寫入: 把每日封存 archive/ commit 回 repo
  pages: write
  id-token: write
  models: read   # 讓內建 GITHUB_TOKEN 能呼叫 GitHub Models (AI 族群/題材分類)

# 避免同時部署互相覆蓋
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 日期 (給快取 key 用)
        id: date
        run: echo "ymd=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 還原月K歷史快取 (避免每天重抓全市場)
        uses: actions/cache@v4
        with:
          path: data
          key: monthly-history-${{ steps.date.outputs.ymd }}
          restore-keys: |
            monthly-history-

      - name: 產生報表
        run: python -m tw_stock_radar
        env:
          # AI 族群分類金鑰 (themes.py 會優先讀 AI_API_KEY)。
          # 組織底下內建 GITHUB_TOKEN 呼叫 GitHub Models 會被擋 (403),
          # 故改放一支「個人帳號」具 Models:read 的 PAT 當 secret AI_API_KEY。
          # 未設定此 secret 時為空字串, 會自動回退到 GITHUB_TOKEN (行為同前)。
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # 內建 token: 仍用於 commit archive (contents: write) 等。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 選用: 設了才啟用 FinMind 備援 (yfinance 抓不到時)。免費註冊 finmindtrade.com。
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 封存今日結果 (commit archive/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --staged --quiet; then
            echo "封存無變動"
          else
            git commit -m "archive: $(date -u +%Y-%m-%d) [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
