name: 每日台股月K創新高雷達

on:
  schedule:
    # 台灣 16:20 / 16:50 / 17:30 三個錯開時段 (週一至五, 收盤資料已穩定)。
    # 多時段備援: 任一個成功觸發即更新; 流程冪等 (同一交易日重覆跑只覆蓋同一份, 無副作用)。
    # 刻意避開整點 (0 分) 壅塞時段; GitHub 排程為「盡力而為」, 故用多時段降低漏跑機率。
    # public repo 跑 Actions 免費不限量; repo 轉移後重推此檔可讓排程重新註冊。
    - cron: "20 8 * * 1-5"   # 16:20 台灣
    - cron: "50 8 * * 1-5"   # 16:50 台灣 (備援)
    - cron: "30 9 * * 1-5"   # 17:30 台灣 (備援)
  workflow_dispatch: {}   # 允許在 Actions 頁面手動觸發

permissions:
  contents: write   # 需要寫入: 把每日封存 archive/ commit 回 repo
  pages: write
  id-token: write
  models: read   # 讓內建 GITHUB_TOKEN 能呼叫 GitHub Models (AI 族群/題材分類)

# 避免同時部署互相覆蓋
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 日期 (給快取 key 用)
        id: date
        run: echo "ymd=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 還原月K歷史快取 (避免每天重抓全市場)
        uses: actions/cache@v4
        with:
          path: data
          key: monthly-history-${{ steps.date.outputs.ymd }}
          restore-keys: |
            monthly-history-

      - name: 產生報表
        run: python -m tw_stock_radar
        env:
          # AI 族群分類金鑰 (themes.py 會優先讀 AI_API_KEY)。
          # 組織底下內建 GITHUB_TOKEN 呼叫 GitHub Models 會被擋 (403),
          # 故改放一支「個人帳號」具 Models:read 的 PAT 當 secret AI_API_KEY。
          # 未設定此 secret 時為空字串, 會自動回退到 GITHUB_TOKEN (行為同前)。
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # 內建 token: 仍用於 commit archive (contents: write) 等。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 選用: 設了才啟用 FinMind 備援 (yfinance 抓不到時)。免費註冊 finmindtrade.com。
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      # 先部署 Pages (最重要的產出), 不讓後續封存的任何狀況擋到上線。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # 封存當日結果 (盡力而為): rebase 後再推, 遇競態自動重試;
      # 即使失敗也不影響上面的部署 (continue-on-error)。
      - name: 封存今日結果 (commit archive/)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --staged --quiet; then
            echo "封存無變動"; exit 0
          fi
          git commit -m "archive: $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "封存已推送"; exit 0
            fi
            echo "推送競態, 重試 $i ..."; sleep 3
          done
          echo "封存推送失敗 (不影響部署, 下次再補)"; exit 0
